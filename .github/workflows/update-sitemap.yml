
name: Update Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://overallmarkscalculator.github.io
          date-only: true
          exclude-paths: google9cfe039434b52320.html


      - name: Commit updated sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sitemap lastmod"
          file_pattern: sitemap.xml
